<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل مدیریتی</title>
<style>
body {
  background:#101827;
  color:white;
  font-family:Tahoma,sans-serif;
  text-align:center;
  padding:30px 15px;
}
.card {
  max-width:420px;
  margin:50px auto;
  padding:25px;
  background:#1e293b;
  border-radius:18px;
}
input,button {
  width:100%;
  padding:13px;
  margin-top:12px;
  border:0;
  border-radius:9px;
  box-sizing:border-box;
}
button {
  background:#16a34a;
  color:white;
  font-size:16px;
}
</style>
</head>
<body>
<div class="card">
<h2>پنل مدیریتی</h2>
<p>ورود مدیر</p>
<input type="password" id="password" placeholder="رمز عبور">
<button onclick="login()">ورود</button>
<p id="message"></p>
</div>
<script>
function login(){
 document.getElementById('message').textContent =
 'پنل اولیه آماده توسعه است.';
}
</script>
</body>
</html>
